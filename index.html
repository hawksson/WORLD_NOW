<script>
(()=>{
'use strict';
const STORAGE='worldnow-prototype-articles-v1';
const VIDEO='https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4';
const DEMO=[
{id:'n1',title:'Verden i fokus: sådan følger vi dagens vigtigste historier',category:'Verden',type:'video',summary:'Et eksempel på en international hovedhistorie med video, baggrund og en kort, overskuelig forklaring.',body:'Dette er en demonstrationsartikel. I en rigtig udgave vil redaktionen bruge verificerede oplysninger, kildeangivelser og rettighedsgodkendt video.',image:'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1200&q=85',video:VIDEO,duration:'1:00',status:'published',breaking:true,date:'2026-11-16',gallery:[]},
{id:'n2',title:'Teknologi: nye idéer ændrer vores hverdag',category:'Teknologi',type:'video',summary:'Se en kort introduktion til globale teknologitrends. Videoen er kun demonstrationsmateriale.',body:'Dette er en demohistorie, ikke en opdateret nyhedsartikel.',image:'https://images.unsplash.com/photo-1518770660439-4636190af475?w=900&q=85',video:VIDEO,duration:'1:00',status:'published',breaking:false,date:'2026-11-15',gallery:[]},
{id:'n3',title:'Klima: billeder fra en verden i forandring',category:'Klima',type:'gallery',summary:'En billedserie med forklaringer, som læseren kan bladre igennem.',body:'Billeder og tilhørende forklaring er eksempler på, hvordan redaktionen kan præsentere visuelle historier.',image:'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=900&q=85',video:'',duration:'',status:'published',breaking:false,date:'2026-11-15',gallery:[{image:'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1200&q=85',caption:'Eksempelbillede 1: natur og skovlandskab.'},{image:'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1200&q=85',caption:'Eksempelbillede 2: bjerglandskab og atmosfære.'},{image:'https://images.unsplash.com/photo-1500534623283-312aade485b7?w=1200&q=85',caption:'Eksempelbillede 3: grønne landskaber.'}]},
{id:'n4',title:'Global økonomi forklaret på 60 sekunder',category:'Økonomi',type:'video',summary:'Formatet gør komplekse historier lette at forstå med en kort video og tekst.',body:'Eksempelartikel. Alle aktuelle tal og oplysninger skal verificeres inden publicering.',image:'https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=900&q=85',video:VIDEO,duration:'1:00',status:'published',breaking:false,date:'2026-11-14',gallery:[]},
{id:'n5',title:'Europæiske perspektiver: politik i billeder',category:'Politik',type:'article',summary:'Et eksempel på en klassisk artikel med stor illustration og overskuelig forklaring.',body:'Artiklen viser, hvordan tekstnyheder kan indgå mellem videoer og billedgallerier.',image:'https://images.unsplash.com/photo-1529107386315-e1a2ed48a620?w=900&q=85',video:'',duration:'',status:'published',breaking:false,date:'2026-11-13',gallery:[]},
{id:'n6',title:'Sport: øjeblikke der samler fans verden over',category:'Sport',type:'video',summary:'Videokort med afspilning direkte på hjemmesiden.',body:'En demonstrationshistorie om videoformatet til sportsnyheder.',image:'https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=900&q=85',video:VIDEO,duration:'1:00',status:'published',breaking:false,date:'2026-11-12',gallery:[]}
];
const clone=v=>JSON.parse(JSON.stringify(v));let articles=load();let route='home',category='Alle',search='',mobileNav=false,preview='desktop',galleryPos=0,editing=null,tab='overview';
function load(){try{const a=JSON.parse(localStorage.getItem(STORAGE));return Array.isArray(a)?a:clone(DEMO)}catch{return clone(DEMO)}}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(articles));return true}catch{toast('Browserlageret er fuldt. Brug kortere billed-URL’er.');return false}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safeUrl(v){const str=String(v||'').trim();try{const u=new URL(str,location.href);return ['http:','https:'].includes(u.protocol)?esc(u.href):''}catch{return ''}}
function photo(a){return safeUrl(a.image)||'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=900&q=80'}
function text(v){return esc(v).replace(/\n/g,'<br>')}
function toast(message){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=message;document.body.append(d);setTimeout(()=>d.remove(),3600)}
function go(where){route=where;mobileNav=false;window.scrollTo({top:0,behavior:'instant'});render()}
function getPublished(){return articles.filter(a=>a.status==='published').filter(a=>category==='Alle'||a.category===category).filter(a=>!search||[a.title,a.summary,a.category].some(v=>String(v).toLowerCase().includes(search.toLowerCase())))}
function header(){const cats=['Alle','Verden','Politik','Teknologi','Økonomi','Klima','Sport'];return `<div class="topline"><div class="inner"><div><span class="tinybadge">PROTOTYPE</span> &nbsp; WORLD NOW / Video-first nyheder</div><div class="topline-right"><span>Demoindhold · Ikke aktuelle nyheder</span><span>16. NOV 2026</span></div></div></div><header class="header"><div class="header-inner"><a href="#" class="logo" data-action="home" aria-label="WORLD NOW forside"><span class="logo-mark">▶</span><span class="logo-type">WORLD<span>NOW.</span></span></a><nav class="nav" aria-label="Nyhedskategorier">${cats.map(c=>`<button data-cat="${esc(c)}" class="${category===c?'active':''}">${esc(c)}</button>`).join('')}</nav><div class="header-actions"><button class="btn dark" data-action="cms">⚙ CMS Dashboard</button><button class="btn mobile-toggle" data-action="toggle-nav" aria-label="Åbn menu">☰</button></div></div></header>${mobileNav?`<div class="mobile-nav">${cats.map(c=>`<button data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:''}`}
function storyImage(a){const icon=a.type==='video'?'▶':a.type==='gallery'?'▦':'↗';return `<button class="story-image image-trigger" data-open="${esc(a.id)}" aria-label="Åbn ${esc(a.title)}"><div class="story-photo" style="background-image:url('${photo(a)}')"></div>${a.breaking?'<span class="pill on-dark top-tag">DEMO BREAKING</span>':''}<span class="play-icon">${icon}</span>${a.type==='video'?`<span class="duration">${esc(a.duration||'VIDEO')}</span>`:''}</button>`}
function card(a,compact=false){return `<article class="${compact?'compact-story':'story-card'}">${storyImage(a)}<div class="story-content"><span class="eyebrow" style="margin:0">${esc(a.category)} · ${a.type==='video'?'VIDEO':a.type==='gallery'?'BILLEDSERIE':'ARTIKEL'}</span><button class="read-button" data-open="${esc(a.id)}"><h3>${esc(a.title)}</h3></button><p>${esc(a.summary)}</p>${compact?'':`<div class="card-actions"><div class="story-meta">${esc(a.date)}</div><button class="linkish" data-open="${esc(a.id)}">${a.type==='video'?'Afspil video':a.type==='gallery'?'Se billeder':'Læs historien'} →</button></div>`}</div></article>`}
function galleryBlock(a){const pics=a.gallery?.length?a.gallery:[{image:a.image,caption:a.summary}];galleryPos=Math.min(galleryPos,pics.length-1);const p=pics[galleryPos];return `<section class="gallery-section" aria-label="Billedserie"><div class="gallery-visual"><img src="${safeUrl(p.image)}" alt="${esc(p.caption||'Billedserie')}"><button class="prev" data-action="prev-gallery" aria-label="Forrige billede">‹</button><button class="next" data-action="next-gallery" aria-label="Næste billede">›</button></div><div class="gallery-text"><span class="eyebrow">BILLEDSERIE · DEMO</span><h2>${esc(a.title)}</h2><p>${esc(p.caption||a.summary)}</p><div class="gallery-count">Billede ${galleryPos+1} af ${pics.length}</div><div class="dots">${pics.map((_,i)=>`<button class="${i===galleryPos?'active':''}" data-gallery="${i}" aria-label="Vis billede ${i+1}"></button>`).join('')}</div></div></section>`}
function newsBody(){const all=getPublished();const hero=all[0],side=all.slice(1,3),cards=all.filter(x=>x.id!==hero?.id && !side.some(y=>y.id===x.id));const gallery=all.find(a=>a.type==='gallery'&&a.gallery?.length);return `<div class="container"><div class="demo-ribbon">ⓘ <span><strong>Interaktiv prototype:</strong> Alle historier og breaking-labels er eksempler. Videoerne er testklip, ikke optagelser af de beskrevne historier. CMS-ændringer gemmes kun i denne browser.</span></div><div class="ticker"><div class="ticker-label">● DEMO BREAKING</div><div class="ticker-text">Eksempel på nyhedsticker: Redaktionen kan fremhæve vigtige historier fra CMS-dashboardet.</div></div><div class="section-head"><div><div class="eyebrow">GLOBALT PERSPEKTIV / DEMO</div><h2>${category==='Alle'?'Dagens historier':esc(category)}</h2></div><div class="searchbox"><input id="news-search" placeholder="Søg i nyheder..." aria-label="Søg i nyheder" value="${esc(search)}"><span>⌕</span></div></div>${all.length?`<div class="hero-layout"><article class="hero"><div class="story-photo" style="background-image:url('${photo(hero)}')"></div><div class="hero-body"><span class="pill on-dark">${hero.breaking?'DEMO BREAKING':esc(hero.category)}</span><h1>${esc(hero.title)}</h1><p>${esc(hero.summary)}</p><div style="display:flex;align-items:center;gap:17px"><button class="play-large" data-open="${esc(hero.id)}" aria-label="Åbn hovedhistorie">${hero.type==='video'?'▶':'↗'}</button><div class="story-meta">${hero.type==='video'?'SE VIDEO':hero.type==='gallery'?'SE BILLEDSERIE':'LÆS ARTIKEL'} · ${esc(hero.date)} · DEMO</div></div></div></article><div class="hero-aside">${side.map(a=>card(a,true)).join('')||'<div class="empty">Flere historier kommer her.</div>'}</div></div><div class="section-head"><div><div class="eyebrow">FØLG MED</div><h2>Seneste historier</h2></div><span class="muted">Klik på kortene for at åbne dem</span></div>${cards.length?`<div class="grid-stories">${cards.map(a=>card(a)).join('')}</div>`:'<div class="empty"><h3>Ingen flere historier i denne visning</h3><p>Vælg en anden kategori eller opret nye historier i CMS.</p></div>'}${gallery?galleryBlock(gallery):''}`:`<div class="empty"><h3>Ingen nyheder fundet</h3><p>Prøv et andet søgeord eller vælg “Alle”.</p><button class="btn" data-action="clear-filter">Vis alle nyheder</button></div>`}</div>`}
function footer(){return `<footer class="footer"><div class="container footer-inner"><div><strong>WORLD NOW</strong> · Video-first news prototype</div><div>Demo · Ingen live-nyhedsfeed · Ingen redaktionel backend · Ingen brugerlogin</div></div></footer>`}
function stats(){return `<div class="statgrid"><div class="stat"><div class="label">Alle historier</div><div class="num">${articles.length}</div><div class="muted" style="font-size:11px">Oprettet i demo-CMS</div></div><div class="stat"><div class="label">Udgivet</div><div class="num">${articles.filter(a=>a.status==='published').length}</div><div class="muted" style="font-size:11px">Vises på forsiden</div></div><div class="stat"><div class="label">Kladder</div><div class="num">${articles.filter(a=>a.status==='draft').length}</div><div class="muted" style="font-size:11px">Ikke offentliggjort</div></div></div>`}
function table(){return `<div class="panel"><div class="panel-head"><h2>Redaktionelt overblik</h2><button class="btn red small" data-action="new">+ Opret nyhed</button></div><div class="table-scroller"><table><thead><tr><th>Nyhed</th><th>Kategori</th><th>Format</th><th>Status</th><th>Handling</th></tr></thead><tbody>${articles.map(a=>`<tr><td><strong>${esc(a.title)}</strong><br><span class="muted">${esc(a.date)}</span></td><td>${esc(a.category)}</td><td>${a.type==='video'?'▶ Video':a.type==='gallery'?'▦ Galleri':'✎ Artikel'}</td><td><span class="status ${a.status==='draft'?'draft':''}">${a.status==='draft'?'Kladde':'Udgivet'}</span></td><td><div class="table-actions"><button class="btn small" data-edit="${esc(a.id)}">Rediger</button><button class="btn small" data-toggle="${esc(a.id)}">${a.status==='draft'?'Udgiv':'Afpublicer'}</button><button class="btn small" data-delete="${esc(a.id)}" aria-label="Slet nyhed">✕</button></div></td></tr>`).join('')}</tbody></table></div></div>`}
function form(){const a=editing?articles.find(x=>x.id===editing):null;const v=a||{title:'',category:'Verden',type:'video',summary:'',body:'',image:'',video:'',duration:'',status:'draft',breaking:false,gallery:[]};return `<div class="panel"><div class="panel-head"><h2>${a?'Rediger nyhed':'Opret nyhed'}</h2><button class="btn small" data-action="overview">← Tilbage</button></div><form id="story-form" class="editor"><div class="helpbox"><strong>CMS-prototype:</strong> Denne formular virker. Du kan oprette, opdatere, udgive og afpublicere historier. Indhold gemmes lokalt på denne enhed og er ikke tilgængeligt for andre besøgende.</div><div class="form-grid"><div class="field full"><label for="title">Overskrift *</label><input id="title" name="title" required maxlength="160" value="${esc(v.title)}" placeholder="Skriv en klar nyhedsoverskrift"></div><div class="field"><label for="category">Kategori</label><select id="category" name="category">${['Verden','Politik','Teknologi','Økonomi','Klima','Sport'].map(c=>`<option ${v.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label for="type">Indholdstype</label><select id="type" name="type"><option value="video" ${v.type==='video'?'selected':''}>Videonyhed</option><option value="gallery" ${v.type==='gallery'?'selected':''}>Billedgalleri</option><option value="article" ${v.type==='article'?'selected':''}>Artikel</option></select></div><div class="field full"><label for="summary">Kort forklaring *</label><textarea id="summary" name="summary" required placeholder="Vises på nyhedskortet">${esc(v.summary)}</textarea></div><div class="field full"><label for="body">Artikeltekst</label><textarea id="body" name="body" placeholder="Ekstra forklaring, kildeoplysninger og baggrund">${esc(v.body)}</textarea></div><div class="field full"><label for="image">Forsidebillede (https://-URL)</label><input id="image" name="image" value="${esc(v.image)}" placeholder="https://.../billede.jpg"><div class="hint">Indsæt en offentlig billed-URL, du har ret til at bruge. Eksterne billeder kræver internetforbindelse.</div></div><div class="field full"><label for="video">Videoklip (direkte .mp4 / .webm URL)</label><input id="video" name="video" value="${esc(v.video)}" placeholder="https://.../video.mp4"><div class="hint">HTML5-video understøttes. Links til almindelige YouTube-sider kan ikke afspilles i denne demoafspiller.</div></div><div class="field"><label for="duration">Videolængde (valgfri)</label><input id="duration" name="duration" value="${esc(v.duration)}" placeholder="1:25"></div><div class="field"><label for="breaking">Fremhævning</label><select id="breaking" name="breaking"><option value="false" ${!v.breaking?'selected':''}>Almindelig nyhed</option><option value="true" ${v.breaking?'selected':''}>Demo breaking news</option></select></div><div class="field full"><label for="gallery">Billedgalleri: én billed-URL pr. linje</label><textarea id="gallery" name="gallery" style="min-height:100px" placeholder="https://.../billede1.jpg\nhttps://.../billede2.jpg">${esc((v.gallery||[]).map(p=>p.image).join('\n'))}</textarea></div><div class="field full"><label for="captions">Billedtekster: én tekst pr. linje (samme rækkefølge)</label><textarea id="captions" name="captions" style="min-height:100px" placeholder="Forklaring til billede 1\nForklaring til billede 2">${esc((v.gallery||[]).map(p=>p.caption).join('\n'))}</textarea></div></div><div class="editor-actions"><button class="btn dark" type="submit" name="intent" value="draft">Gem som kladde</button><button class="btn red" type="submit" name="intent" value="published">Gem og udgiv</button><button class="btn" type="button" data-action="overview">Annuller</button></div></form></div>`}
function cms(){return `${header()}<main class="cms-shell"><aside class="sidebar"><div class="side-title">WORLD NOW CMS</div><button class="side-link ${tab==='overview'?'active':''}" data-action="overview">▦ &nbsp; Dashboard</button><button class="side-link ${tab==='edit'?'active':''}" data-action="new">✎ &nbsp; Opret nyhed</button><button class="side-link" data-action="home">↗ &nbsp; Se hjemmesiden</button><div class="side-note"><strong>Demotilstand</strong><br>Ingen server, login eller offentlig publicering. Redigeringer gemmes i din browser.</div></aside><div class="dashboard"><div class="toolbar"><div><div class="eyebrow">REDAKTION / PROTOTYPE</div><h1>${tab==='edit'?(editing?'Rediger historie':'Ny historie'):'CMS Dashboard'}</h1><p class="lead">Administrer videonyheder, billedserier og artikler i dit eget demo-CMS.</p></div><button class="btn" data-action="home">↗ Se forsiden</button></div>${tab==='overview'?`${stats()}${table()}<button class="btn ghost" data-action="reset">↺ Nulstil demoindhold</button>`:form()}</div></main>`}
function site(){return `${header()}<main id="news-frame" class="${preview==='mobile'?'mobile-preview':''}">${newsBody()}</main>${footer()}`}
function render(){document.getElementById('app').innerHTML=route==='cms'?cms():site();document.title=route==='cms'?'WORLD NOW CMS · Demo':'WORLD NOW · International Video News Demo';if(route==='home'&&search){const el=document.getElementById('news-search');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}}
function modal(a){const v=a.type==='video'&&safeUrl(a.video),g=a.gallery||[];document.getElementById('modal-root').innerHTML=`<div class="modal-back" data-action="close-overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(a.title)}"><div class="modal-frame"><button class="modal-close" data-action="close-modal" aria-label="Luk">×</button>${v?`<video class="modal-video" controls autoplay playsinline preload="metadata" poster="${photo(a)}"><source src="${safeUrl(a.video)}">Din browser understøtter ikke dette videoformat.</video>`:g.length?`<img style="width:100%;max-height:480px;object-fit:cover" src="${safeUrl(g[0].image)}" alt="${esc(g[0].caption)}">`:`<img style="width:100%;max-height:440px;object-fit:cover" src="${photo(a)}" alt="Illustration">`}</div><div class="modal-head"><span class="pill">${esc(a.category)} · ${a.type==='video'?'VIDEO':a.type==='gallery'?'BILLEDSERIE':'ARTIKEL'}</span><h2>${esc(a.title)}</h2><p><strong>${esc(a.summary)}</strong></p><p>${text(a.body)}</p>${a.type==='video'?'<p style="font-size:12px;color:#a56c16">Demo: Testvideoen illustrerer afspilning og dokumenterer ikke overskriftens indhold.</p>':''}${g.length?`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:18px">${g.map((p,i)=>`<button data-modal-gallery="${i}" style="padding:0;border:0;text-align:left;background:white"><img src="${safeUrl(p.image)}" alt="${esc(p.caption)}" style="aspect-ratio:4/3;object-fit:cover;border-radius:8px;width:100%"><span style="font-size:11px;color:#64748b">${esc(p.caption)}</span></button>`).join('')}</div>`:''}<div class="story-meta" style="margin-top:18px">${esc(a.date)} · WORLD NOW DEMO · Ingen verificeret aktuel nyhed</div></div></div></div>`;document.body.style.overflow='hidden';document.querySelector('.modal-close')?.focus()}
function closeModal(){const video=document.querySelector('.modal video');if(video)video.pause();document.getElementById('modal-root').innerHTML='';document.body.style.overflow=''}
function action(name){if(name==='home'){go('home')}else if(name==='cms'){tab='overview';go('cms')}else if(name==='new'){editing=null;tab='edit';route='cms';render()}else if(name==='overview'){editing=null;tab='overview';render()}else if(name==='toggle-nav'){mobileNav=!mobileNav;render()}else if(name==='clear-filter'){category='Alle';search='';render()}else if(name==='close-modal'){closeModal()}else if(name==='reset'){if(confirm('Vil du fjerne dine lokale ændringer og gendanne demoindholdet?')){articles=clone(DEMO);save();tab='overview';render();toast('Demoindholdet er nulstillet.')}}else if(name==='prev-gallery'||name==='next-gallery'){const a=getPublished().find(x=>x.type==='gallery'&&x.gallery?.length);if(a){galleryPos=(galleryPos+(name==='next-gallery'?1:-1)+a.gallery.length)%a.gallery.length;render()}}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-cat],[data-open],[data-edit],[data-toggle],[data-delete],[data-gallery],[data-modal-gallery]');if(!el)return;if(el.tagName==='A')e.preventDefault();if(el.dataset.action){if(el.dataset.action==='close-overlay'){if(e.target===el)closeModal();return}action(el.dataset.action);return}if(el.dataset.cat){category=el.dataset.cat;search='';galleryPos=0;go('home');return}if(el.dataset.open){const a=articles.find(a=>a.id===el.dataset.open);if(a)modal(a);return}if(el.dataset.edit){editing=el.dataset.edit;tab='edit';render();return}if(el.dataset.toggle){const a=articles.find(a=>a.id===el.dataset.toggle);if(a){a.status=a.status==='draft'?'published':'draft';save();render();toast(a.status==='published'?'Nyheden er udgivet på demo-forsiden.':'Nyheden er afpubliceret.')}return}if(el.dataset.delete){const a=articles.find(a=>a.id===el.dataset.delete);if(a&&confirm('Slet denne demo-nyhed?')){articles=articles.filter(x=>x.id!==a.id);save();render();toast('Nyheden er slettet.')}return}if(el.dataset.gallery!==undefined){galleryPos=Number(el.dataset.gallery);render();return}if(el.dataset.modalGallery!==undefined){const img=el.querySelector('img'),top=document.querySelector('.modal-frame>img');if(img&&top){top.src=img.src;top.alt=img.alt}return}});
document.addEventListener('input',e=>{if(e.target.id==='news-search'){search=e.target.value;const pos=e.target.selectionStart;const start=document.getElementById('news-frame');if(start)start.innerHTML=newsBody();const el=document.getElementById('news-search');el?.focus();el?.setSelectionRange(pos,pos)}});
document.addEventListener('submit',e=>{if(e.target.id!=='story-form')return;e.preventDefault();const fd=new FormData(e.target);const submitter=e.submitter;const intent=submitter?.value==='published'?'published':'draft';const images=String(fd.get('gallery')||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const captions=String(fd.get('captions')||'').split(/\r?\n/);const gallery=images.map((image,i)=>({image,caption:captions[i]||`Billede ${i+1}`}));const id=editing||'custom-'+Date.now();const a={id,title:String(fd.get('title')||'').trim(),category:String(fd.get('category')||'Verden'),type:String(fd.get('type')||'video'),summary:String(fd.get('summary')||'').trim(),body:String(fd.get('body')||''),image:String(fd.get('image')||'').trim(),video:String(fd.get('video')||'').trim(),duration:String(fd.get('duration')||''),breaking:fd.get('breaking')==='true',status:intent,date:new Date().toISOString().slice(0,10),gallery};if(!a.title||!a.summary){toast('Udfyld overskrift og kort forklaring.');return}if(a.type==='gallery'&&!a.image&&gallery.length)a.image=gallery[0].image;if(!safeUrl(a.image))a.image='https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=900&q=80';const idx=articles.findIndex(x=>x.id===id);if(idx<0)articles.unshift(a);else articles[idx]=a;if(save()){editing=null;tab='overview';render();toast(intent==='published'?'Nyheden er udgivet på demo-forsiden.':'Nyheden er gemt som kladde.')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
})();
</script>
</body>
</html>
